allowBuilds:
  "@parcel/watcher": false
  unrs-resolver: false
audit:
  # image-size has no fixed release. The pnpm patch below fixes both advisories,
  # and security:check exercises the patched parsers before audit runs.
  ignore:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # No upstream release; the pinned patch and security regressions guard this.
    - GHSA-gcqx-w48m-w2h4
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Required by the glob/minimatch security releases.
  - "@isaacs/nonrecursive-glob-match@1.0.3"
  - path-scurry@3.0.0
  - basic-ftp@6.2.5
  - zod@4.6.7
  - minimatch@11.0.4
  - glob@14.0.3
  - jest@30.5.2
  - babel-jest@30.5.2
  # Security fix, a few hours short of the 14-day window.
  - source-map-js@1.2.2
  # Grandfather the exact lockfile from 2026-08-04. Future versions still have
  # to clear the full release-age window.
  - "@eslint-community/eslint-utils@4.10.1"
  - "@expo/cli@57.0.10"
  - "@expo/config-plugins@57.0.6"
  - "@expo/config@57.0.6"
  - "@expo/fingerprint@0.20.6"
  - "@expo/image-utils@0.11.4"
  - "@expo/metro-config@57.0.7"
  - "@expo/prebuild-config@57.0.9"
  - "@expo/require-utils@57.0.4"
  - "@expo/router-server@57.0.4"
  - "@release-it/conventional-changelog@12.0.0"
  - babel-preset-expo@57.0.4
  - baseline-browser-mapping@2.11.3
  - brace-expansion@5.0.9
  - electron-to-chromium@1.5.396
  - eslint-plugin-safe-jsx@1.3.0
  - expo-asset@57.0.7
  - expo-constants@57.0.7
  - expo-modules-autolinking@57.0.9
  - expo-modules-core@57.0.7
  - expo-modules-jsi@57.0.4
  - expo@57.0.8
  - flatted@3.4.3
  - flow-estree@0.324.0
  - flow-parser@0.324.0
  - giget@3.3.1
  - ip-address@10.3.1
  - postcss@8.5.23
  - release-it@21.0.0
  - sax@1.6.1
  - undici@7.29.0
  # Security fix for GHSA-xjj6-f33q-929c, bypass the release-age window.
  - undici@7.30.1
  - node-forge@1.4.1
  - ip-address@10.7.4
  # magic-* is first-party tooling and can update immediately.
  - "magic-*"
  # Let the security fix through the global release-age gate.
  - brace-expansion@1.1.18
  - nanoid@3.3.18
  - js-yaml@3.15.2
  - js-yaml@4.3.2
# pnpm 11 no longer reads the `pnpm` key from package.json, and `overrides` has
# no other home, so this file carries the old Yarn pins and scoped security
# fixes. Yarn's `**/a/b` globs become pnpm's `a>b` selectors.
overrides:
  # Dependabot: source-map-js <1.2.2, compression <1.8.2, tinypool <2.1.2 (dev-only tooling).
  source-map-js@<1.2.2: ^1.2.2
  compression@<1.8.2: ^1.8.2
  tinypool@<2.1.2: ^2.1.2
  # GHSA (Dependabot): shell-quote >=1.8.4 <1.11.0 is vulnerable. react-devtools-core
  # (dev-only, via react-native) pulls it in.
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  "@expo/plist>@xmldom/xmldom": 0.8.15
  "plist>@xmldom/xmldom": 0.9.12
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  xcode>uuid: 11.1.1
  # GHSA-2883-xcg3-v3hh: maxTotalMergeKeys skips empty merge sources, so a
  # crafted YAML doc burns CPU. Dev-only (eslint, expo CLI, jest coverage),
  # bumped anyway per Dependabot alerts #57/#58.
  js-yaml@<3.15.2: ^3.15.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  # GHSA NAT64 classifier gap (SSRF). Dev-only via release-it > proxy-agent >
  # socks, bumped per Dependabot alert #62.
  ip-address@>=10.2.0 <10.7.4: 10.7.4
  # Registry audit: patch certificate parsing advisories.
  node-forge@<1.4.1: 1.4.1
  # GHSA-xjj6-f33q-929c: malformed responses can crash release-it.
  undici@>=7.0.0 <7.30.1: 7.30.1
  # Major tooling APIs are exercised by dependency-security-check and Jest.
  basic-ftp@<6.2.1: 6.2.5
  zod@<4.6.6: 4.6.7
  minimatch@<11.0.1: 11.0.4
  glob@>=9 <14.0.2: 14.0.3
  test-exclude@<7: 7.0.2
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  image-size@1.2.1: patches/image-size@1.2.1.patch
  minimatch@11.0.4: patches/minimatch@11.0.4.patch

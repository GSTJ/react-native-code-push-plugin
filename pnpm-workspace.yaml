  - "@expo/router-server@57.0.4"
  - "@release-it/conventional-changelog@12.0.0"
  - babel-preset-expo@57.0.4
  - baseline-browser-mapping@2.11.3
  - brace-expansion@5.0.9
  - electron-to-chromium@1.5.396
  - eslint-plugin-safe-jsx@1.3.0
